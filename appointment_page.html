<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حجز موعد - Al Shifa Hospital</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background-color: #f4f8fb;
        }

        /* ===== Navbar ===== */
        header {
            background-color: #0a4f70;
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            color: white;
            font-size: 22px;
            font-weight: bold;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 20px;
        }

        nav ul li a {
            text-decoration: none;
            color: white;
            font-size: 15px;
            transition: 0.3s;
        }

        nav ul li a:hover {
            color: #00d4ff;
        }

        /* ===== Appointment Section ===== */
        .appointment-section {
            padding: 60px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .appointment-box {
            background-color: white;
            padding: 40px;
            border-radius: 10px;
            width: 100%;
            max-width: 650px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .appointment-box h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #0a4f70;
        }

        .appointment-box p {
            text-align: center;
            margin-bottom: 30px;
            color: #555;
            font-size: 15px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: #022c43;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 14px;
            transition: 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #0a4f70;
            outline: none;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background-color: #0a4f70;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        .btn:hover {
            background-color: #083c55;
        }

        /* ===== Footer ===== */
        footer {
            background-color: #022c43;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 40px;
        }

        /* ===== Responsive ===== */
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 10px;
            }

            nav ul {
                flex-wrap: wrap;
                justify-content: center;
            }
        }

    </style>
</head>

<body>

    <!-- ===== NAVBAR ===== -->
    <header>
        <div class="logo">Al Shifa Hospital</div>

        <nav>
            <ul>
                <li><a href="index.html">الرئيسية</a></li>
                <li><a href="departments.html">الأقسام</a></li>
                <li><a href="doctors.html">الأطباء</a></li>
                <li><a href="about.html">من نحن</a></li>
                <li><a href="appointment.html">حجز موعد</a></li>
            </ul>
        </nav>
    </header>

    <!-- ===== APPOINTMENT SECTION ===== -->
    <section class="appointment-section">
        <div class="appointment-box">
            <h1>حجز موعد</h1>
            <p>
                يرجى تعبئة البيانات التالية لحجز موعد في مشفى الشفاء،
                وسيتم التواصل معكم لتأكيد الحجز.
            </p>

            <form>
                <div class="form-group">
                    <label>الاسم الكامل</label>
                    <input type="text" placeholder="أدخل اسمك الكامل" required>
                </div>

                <div class="form-group">
                    <label>رقم الهاتف</label>
                    <input type="tel" placeholder="05XXXXXXXX" required>
                </div>

                <div class="form-group">
                    <label>البريد الإلكتروني</label>
                    <input type="email" placeholder="example@email.com">
                </div>

                <div class="form-group">
                    <label>القسم المطلوب</label>
                    <select required>
                        <option value="">اختر القسم</option>
                        <option>الطب العام</option>
                        <option>طب الأطفال</option>
                        <option>القلب والأوعية الدموية</option>
                        <option>الجراحة العامة</option>
                        <option>النسائية والتوليد</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>التاريخ</label>
                    <input type="date" required>
                </div>

                <div class="form-group">
                    <label>الوقت</label>
                    <input type="time" required>
                </div>

                <div class="form-group">
                    <label>ملاحظات إضافية</label>
                    <textarea placeholder="أي تفاصيل إضافية..."></textarea>
                </div>

                <button type="submit" class="btn">تأكيد الحجز</button>
            </form>
        </div>
    </section>

    <!-- ===== FOOTER ===== -->
    <footer>
        <p>© 2026 Al Shifa Hospital - جميع الحقوق محفوظة</p>
    </footer>

</body>
</html>
